name: Sync KHL data

on:
  schedule:
    # Полный дневной sync — раз в сутки, в 03:00 UTC
    - cron: "0 3 * * *"
    # Старт первого live-окна: 13:00 MSK = 10:00 UTC (держит цикл 5 часов, до 18:00 MSK)
    - cron: "0 10 * * *"
    # Старт второго live-окна: 18:00 MSK = 15:00 UTC (держит цикл 5 часов, до 23:00 MSK)
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Base URL (для теста на дев-окружении; пусто = secrets.SITE_URL)'
        default: ''
        required: false
      poll_minutes:
        description: 'Сколько минут держать live-поллер (для ручного запуска)'
        default: '300'
        required: false

jobs:
  live-sync:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 10 * * *' ||
      github.event.schedule == '0 15 * * *'
    runs-on: ubuntu-latest
    # чуть больше 5 часов на запас
    timeout-minutes: 310
    concurrency:
      group: live-sync
      cancel-in-progress: true
    steps:
      - name: Poll live-sync every 5s for the game window
        run: |
          url="${{ inputs.site_url || secrets.SITE_URL }}"
          minutes="${{ inputs.poll_minutes || 300 }}"
          echo "[$(date '+%H:%M:%S')] live-sync poller started, target: $url, window: ${minutes}m"
          end=$(( $(date +%s) + minutes * 60 ))
          i=0
          while [ "$(date +%s)" -lt "$end" ]; do
            i=$((i+1))
            if curl -sf -X POST "$url/api/live-sync" \
              -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}"; then
              [ $(( i % 12 )) -eq 0 ] && echo "[$(date '+%H:%M:%S')] sync OK (iter #$i)"
            else
              echo "[$(date '+%H:%M:%S')] sync FAILED (iter #$i), will retry"
            fi
            now=$(date +%s)
            rem=$(( end - now ))
            [ "$rem" -le 0 ] && break
            sleep $(( rem < 5 ? rem : 5 ))
          done
          echo "[$(date '+%H:%M:%S')] poll window finished after $i iterations"