name: Live Sync KHL matches data

on:
  schedule:
    # Полный дневной sync — раз в сутки, в 00:00 UTC
    - cron: "0 0 * * *"
    # Старт первого live-окна: 10:00 MSK = 07:00 UTC (держит цикл 7 часов, до 17:00 MSK)
    - cron: "0 7 * * *"
    # Старт второго live-окна: 18:00 MSK = 14:00 UTC (держит цикл 7 часов, до 24:00 MSK)
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Base URL (для теста на дев-окружении; пусто = secrets.SITE_URL)'
        default: ''
        required: false
      poll_minutes:
        description: 'Сколько минут держать live-поллер (для ручного запуска)'
        default: '300'
        required: false

jobs:
  live-sync:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 7 * * *' ||
      github.event.schedule == '0 14 * * *'
    runs-on: ubuntu-latest
    # чуть больше 7 часов на запас
    timeout-minutes: 450
    concurrency:
      group: live-sync
      cancel-in-progress: true
    steps:
      - name: Poll live-sync every 5s for the game window
        run: |
          # срезаем завершающий "/", если он есть в секрете — иначе получится
          # двойной слэш "…app//api/live-sync", и Vercel/Next.js ответит 308
          # на "тот же" (канонический) URL, а curl без -L это не пройдёт
          url="${{ inputs.site_url || secrets.SITE_URL }}"
          url="${url%/}"
          minutes="${{ inputs.poll_minutes || 300 }}"
          echo "[$(date '+%H:%M:%S')] live-sync poller started, target: $url, window: ${minutes}m"
          end=$(( $(date +%s) + minutes * 60 ))
          i=0
          while [ "$(date +%s)" -lt "$end" ]; do
            i=$((i+1))
            if curl -sfL -X POST "$url/api/live-sync" \
              -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}"; then
              [ $(( i % 3 )) -eq 0 ] && echo "[$(date '+%H:%M:%S')] sync OK (iter #$i)"
            else
              echo "[$(date '+%H:%M:%S')] sync FAILED (iter #$i), will retry"
            fi
            now=$(date +%s)
            rem=$(( end - now ))
            [ "$rem" -le 0 ] && break
            sleep $(( rem < 20 ? rem : 20 ))
          done
          echo "[$(date '+%H:%M:%S')] poll window finished after $i iterations"