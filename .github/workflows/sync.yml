name: Sync KHL data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh database
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          test -n "$SYNC_URL"
          test -n "$SYNC_SECRET"
          curl --fail-with-body --retry 2 --retry-delay 5 \
            -X POST "$SYNC_URL" \
            -H "Authorization: Bearer $SYNC_SECRET"
